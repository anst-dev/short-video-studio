<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Tư Duy Ẩn Đằng Sau Khung P-C-T-P-R — Dashi Dark Gold Tech</title>
<style>
@font-face { font-family: 'BeVietnamPro'; src: url('./fonts/BeVietnamPro-Regular.ttf') format('truetype'); font-weight: 400; }
@font-face { font-family: 'BeVietnamPro'; src: url('./fonts/BeVietnamPro-Medium.ttf') format('truetype'); font-weight: 500; }
@font-face { font-family: 'BeVietnamPro'; src: url('./fonts/BeVietnamPro-Bold.ttf') format('truetype'); font-weight: 600 700; }
@font-face { font-family: 'BeVietnamPro'; src: url('./fonts/BeVietnamPro-ExtraBold.ttf') format('truetype'); font-weight: 800 900; }
@font-face { font-family: 'JBMono'; src: url('./fonts/JetBrainsMono-var.ttf') format('truetype'); font-weight: 100 800; }
@font-face { font-family: 'Archivo'; src: url('./fonts/Archivo-var.ttf') format('truetype'); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #05070b; }
canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
const W = 1920, H = 1080, TAU = Math.PI * 2;
const cv = document.getElementById('c');
const g = cv.getContext('2d');
const NOSUB = /[?&]nosub=1/.test(location.search);

// ══════ Dashi Dark Gold Palette (黑底科技风格卡) ══════
const C = {
  bg0: '#05070b', bg1: '#0b0f15', bg2: '#090d13',
  glow: [62, 50, 32],
  gold: '#e5cf95', goldHi: '#faefcc', goldMid: '#ddc994', goldDeep: '#ae915c', goldDk: '#5e4f32',
  coin1: '#f7e9bc', coin2: '#e5ca89', coin3: '#cdac6a', coin4: '#b28e4f', coin5: '#8c6330',
  line: '#c1bea8', line2: '#a19c85', line3: '#746f61', rule: '#554e39',
  cream: '#e2dfd3', white: '#f1efe4', gray: '#8c877b', gray2: '#625b52',
  card: '#1a1713', cardLine: '#373334',
  red: '#b1312a', redDk: '#962621', redTx: '#fee5d5', redLn: '#fcd0c0',
  teal: '#0D9488', ink: '#1a130a',
};
const F = { sans: '"BeVietnamPro"', head: '"Archivo"', mono: '"JBMono"' };
const font = (w, s, f) => `${w} ${s}px ${f || F.sans}`;

// ══════ Utilities ══════
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const P = (t, a, d) => clamp((t - a) / Math.max(0.001, d));
const outC = p => 1 - Math.pow(1 - p, 3);
const inQ = p => p * p;
const inOutC = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p+2,3)/2;
const outBack = p => { const c = 1.6; return 1 + (c+1)*Math.pow(p-1,3) + c*Math.pow(p-1,2); };
const bump = (t, a, d) => Math.sin(Math.PI * P(t, a, d));
function mulberry32(a) { return function() { a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function rrect(x,y,w,h,r) { g.beginPath(); g.roundRect(x,y,w,h,r); }
function tw(s, f) { g.font = f; return g.measureText(s).width; }
function txt(s,x,y,f,col=C.cream,align='center',base='middle') { g.font=f; g.fillStyle=col; g.textAlign=align; g.textBaseline=base; g.fillText(s,x,y); }
function strokeP(pathFn, len, p, width, col, cap='round') {
  if (p <= 0) return;
  g.save(); g.lineWidth = width; g.strokeStyle = col; g.lineCap = cap; g.lineJoin = 'round';
  if (p < 1) g.setLineDash([len * p, len + 10]);
  pathFn(); g.stroke(); g.restore();
}
function circleP(x, y, r, p, w, col, a0 = -Math.PI / 2) {
  strokeP(() => { g.beginPath(); g.arc(x, y, r, a0, a0 + TAU); }, TAU * r, p, w, col, 'butt');
}
function goldGrad(y0, y1) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, C.goldHi); gr.addColorStop(0.42, C.goldMid); gr.addColorStop(0.78, C.goldDeep); gr.addColorStop(1, C.coin5);
  return gr;
}
function coinGrad(y0, y1) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, C.coin1); gr.addColorStop(0.35, C.coin2); gr.addColorStop(0.75, C.coin3); gr.addColorStop(1, C.coin4);
  return gr;
}
function wrapWords(str, fStr, maxW) {
  g.font = fStr; const words = str.split(' '); const out = []; let cur = '';
  for (const w of words) { const test = cur ? cur+' '+w : w; if (g.measureText(test).width > maxW && cur) { out.push(cur); cur=w; } else cur=test; }
  if (cur) out.push(cur); return out;
}

// ══════ Canvas Texture Caches (Built Once) ══════
const BG = document.createElement('canvas'); BG.width = W; BG.height = H;
(() => {
  const b = BG.getContext('2d');
  const lg = b.createLinearGradient(0, 0, W*0.4, H);
  lg.addColorStop(0, C.bg1); lg.addColorStop(0.55, C.bg2); lg.addColorStop(1, C.bg0);
  b.fillStyle = lg; b.fillRect(0, 0, W, H);
  const gw = W/2, gh = H/2, gc = document.createElement('canvas'); gc.width = gw; gc.height = gh;
  const gx = gc.getContext('2d'), id = gx.createImageData(gw, gh), rnd = mulberry32(7);
  for (let i = 0; i < gw * gh; i++) { const v = rnd()*255; id.data[i*4] = v; id.data[i*4+1] = v; id.data[i*4+2] = v; id.data[i*4+3] = 13; }
  gx.putImageData(id, 0, 0); b.imageSmoothingEnabled = false; b.drawImage(gc, 0, 0, W, H);
})();

const VIG = document.createElement('canvas'); VIG.width = W; VIG.height = H;
(() => {
  const v = VIG.getContext('2d'), rg = v.createRadialGradient(W/2, H*0.45, H*0.35, W/2, H*0.45, H*1.05);
  rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(0.7, 'rgba(1,2,4,0.35)'); rg.addColorStop(1, 'rgba(1,2,4,0.72)');
  v.fillStyle = rg; v.fillRect(0, 0, W, H);
})();

const GLOW = document.createElement('canvas'); GLOW.width = 512; GLOW.height = 512;
(() => {
  const x = GLOW.getContext('2d'), rg = x.createRadialGradient(256, 256, 0, 256, 256, 256);
  rg.addColorStop(0, `rgba(${C.glow.join(',')}, 0.62)`); rg.addColorStop(0.35, `rgba(${C.glow.join(',')}, 0.34)`);
  rg.addColorStop(0.7, `rgba(${C.glow.join(',')}, 0.1)`); rg.addColorStop(1, `rgba(${C.glow.join(',')}, 0)`);
  x.fillStyle = rg; x.fillRect(0, 0, 512, 512);
})();

const STARS = document.createElement('canvas'); STARS.width = W + 240; STARS.height = H + 160;
(() => {
  const s = STARS.getContext('2d'), r = mulberry32(31);
  for (let i = 0; i < 300; i++) {
    const big = r() < 0.08, a = big ? 0.32 + r()*0.3 : 0.07 + r()*0.2;
    s.fillStyle = `rgba(236,226,200,${a.toFixed(3)})`; s.beginPath();
    s.arc(r()*STARS.width, r()*STARS.height, big ? 1.3+r()*0.9 : 0.6+r()*0.7, 0, TAU); s.fill();
  }
})();

const GRID = 96, GRIDC = document.createElement('canvas'); GRIDC.width = W + GRID*2; GRIDC.height = H + GRID*2;
(() => {
  const x = GRIDC.getContext('2d'), w = GRIDC.width, h = GRIDC.height;
  x.strokeStyle = 'rgb(229,207,149)'; x.lineWidth = 1; x.globalAlpha = 0.055; x.beginPath();
  for (let gx = 0.5; gx <= w; gx += GRID) { x.moveTo(gx, 0); x.lineTo(gx, h); }
  for (let gy = 0.5; gy <= h; gy += GRID) { x.moveTo(0, gy); x.lineTo(w, gy); }
  x.stroke();
  x.globalAlpha = 0.28; x.beginPath();
  for (let gx = 0.5; gx <= w; gx += GRID) for (let gy = 0.5; gy <= h; gy += GRID) {
    x.moveTo(gx-4, gy); x.lineTo(gx+4, gy); x.moveTo(gx, gy-4); x.lineTo(gx, gy+4);
  }
  x.stroke();
})();

const SUBBAND = document.createElement('canvas'); SUBBAND.width = W; SUBBAND.height = 240;
(() => {
  const x = SUBBAND.getContext('2d'), lg = x.createLinearGradient(0, 0, 0, 240);
  lg.addColorStop(0, 'rgba(2,3,5,0)'); lg.addColorStop(0.45, 'rgba(2,3,5,0.45)'); lg.addColorStop(1, 'rgba(2,3,5,0.7)');
  x.fillStyle = lg; x.fillRect(0, 0, W, 240);
})();

function glowAt(x, y, rx, ry, a) { if (a <= 0) return; g.save(); g.globalAlpha = a; g.drawImage(GLOW, x - rx, y - ry, rx * 2, ry * 2); g.restore(); }

// ══════ Background motion layers ══════
const BG_BOTTOM = 905;
const ORB = [{ rx: 1040, ry: 300, a: 0.11, sp: 0.06, ph: 0.4 }, { rx: 790, ry: 226, a: 0.09, sp: -0.085, ph: 2.3 }, { rx: 560, ry: 158, a: 0.075, sp: 0.11, ph: 4.4 }];
function drawAmbient(t) {
  g.save(); g.beginPath(); g.rect(0, 0, W, BG_BOTTOM); g.clip();
  // 1. Drifting stars
  const ox = -((t * 5) % 240 + 240) % 240;
  g.drawImage(STARS, ox, 0);
  // 2. Coordinate Grid
  const gx = (t * 9) % GRID, gy = (-t * 5) % GRID;
  g.drawImage(GRIDC, gx - GRID*1.5, gy - GRID*1.5);
  // 3. Golden elliptical orbits
  const cx = 960, cy = 520, rot = -0.2 + t * 0.008;
  const cr = Math.cos(rot), sr = Math.sin(rot);
  g.lineWidth = 1.1;
  for (const o of ORB) {
    g.strokeStyle = `rgba(229,207,149,${o.a})`; g.beginPath();
    g.ellipse(cx, cy, o.rx, o.ry, rot, 0, TAU); g.stroke();
    const an = o.ph + t * o.sp, ex = Math.cos(an) * o.rx, ey = Math.sin(an) * o.ry;
    const x = cx + ex * cr - ey * sr, y = cy + ex * sr + ey * cr;
    g.fillStyle = C.goldHi; g.beginPath(); g.arc(x, y, 2.5, 0, TAU); g.fill();
  }
  g.restore();
}

// ══════ Seal Blocks (印章块 — Red A / Gold B) ══════
function sealBlock(x, y, w, h, kind, a=1, s=1) {
  if (a <= 0) return;
  g.save(); g.globalAlpha *= a; g.translate(x + w/2, y + h/2); g.scale(s, s);
  if (kind === 'red') {
    g.fillStyle = C.redDk; rrect(-w/2, -h/2 + 2, w, h, 6); g.fill();
    g.fillStyle = C.red; rrect(-w/2, -h/2, w, h, 6); g.fill();
    g.strokeStyle = 'rgba(252,208,192,0.55)'; g.lineWidth = 1.5;
    rrect(-w/2 + 4, -h/2 + 4, w - 8, h - 8, 3); g.stroke();
  } else {
    g.fillStyle = C.coin5; rrect(-w/2, -h/2 + 2, w, h, 6); g.fill();
    g.fillStyle = coinGrad(-h/2, h/2); rrect(-w/2, -h/2, w, h, 6); g.fill();
    g.strokeStyle = 'rgba(26,19,10,0.35)'; g.lineWidth = 1.5;
    rrect(-w/2 + 4, -h/2 + 4, w - 8, h - 8, 3); g.stroke();
  }
  g.restore();
}

// ══════ Reveal Text with Focus/Blur ══════
function revealText(str, x, y, f, fill, t, t0, opts={}) {
  const { align='center', dur=0.22, stag=0.035, blur=7, dy=10, alpha=1 } = opts;
  if (alpha <= 0 || t < t0) return;
  const total = tw(str, f);
  const x0 = align === 'center' ? x - total/2 : align === 'right' ? x - total : x;
  g.save(); g.font = f; g.textAlign = 'left'; g.textBaseline = 'middle';
  const done = t >= t0 + stag * (str.length - 1) + dur;
  g.fillStyle = typeof fill === 'function' ? fill() : fill;
  if (done) { g.globalAlpha = alpha; g.fillText(str, x0, y); g.restore(); return; }
  let xx = x0;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i], cw = tw(ch, f);
    const p = P(t, t0 + i * stag, dur);
    if (p > 0) {
      const q = outC(p);
      g.globalAlpha = alpha * q;
      if (q < 0.98) g.filter = `blur(${((1 - q) * blur).toFixed(2)}px)`;
      g.fillText(ch, xx, y + (1 - q) * dy);
      g.filter = 'none';
    }
    xx += cw;
  }
  g.restore();
}

// ══════ HUD: Odometer Chapter Number + Corner Header ══════
function drawHUD(t, stepN, titleVi) {
  const a = outC(P(t, 0.4, 0.5)); if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  // Odometer chapter number
  txt(stepN, 110, 112, font(700, 76, F.mono), C.gold, 'left');
  // Fine line extending right
  const lg = g.createLinearGradient(110, 0, 360, 0);
  lg.addColorStop(0, C.gold); lg.addColorStop(0.7, 'rgba(229,207,149,0.5)'); lg.addColorStop(1, 'rgba(229,207,149,0)');
  g.fillStyle = lg; g.fillRect(110, 146, 250, 2);
  // Chapter sub-label (kept clear below the scene headline band y 137–183)
  txt(titleVi, 110, 202, font(600, 22), C.cream, 'left');
  // Right corner topic title
  txt('PCTPR ARCHITECTURE', 1810, 78, font(600, 24, F.mono), C.gray, 'right');
  const rg = g.createLinearGradient(1810, 0, 1500, 0);
  rg.addColorStop(0, C.rule); rg.addColorStop(1, 'rgba(85,78,57,0)');
  g.fillStyle = rg; g.fillRect(1500, 96, 310, 1.5);
  g.restore();
}

// ══════ Subtitle bar ══════
function drawSubtitle(t, cue) {
  if (NOSUB || !cue || t < cue.t0) return;
  let fSize = 42;
  while (fSize > 24 && tw(cue.sub, font(700, fSize)) > 1680) fSize -= 2;
  const f = font(700, fSize), y = 988;
  const str = cue.sub;
  const totalW = tw(str, f);
  const padX = 28, h = Math.round(fSize * 1.6);
  g.save();
  const p = outC(P(t, cue.t0, 0.25));
  g.globalAlpha = p;
  // Background pill
  rrect(W/2 - totalW/2 - padX, y - h/2, totalW + padX*2, h, 12);
  g.fillStyle = 'rgba(10,13,18,0.88)'; g.fill();
  g.strokeStyle = 'rgba(229,207,149,0.35)'; g.lineWidth = 1.5; g.stroke();
  // Keyword highlight tags
  const highlights = [
    { k: 'P - C - T - P - R', col: 'gold' },
    { k: 'PCTPR', col: 'gold' },
    { k: 'Tầng ẩn 01', col: 'gold' },
    { k: 'Tầng ẩn 02', col: 'gold' },
    { k: 'Tầng ẩn 03', col: 'gold' },
    { k: 'Không gian âm', col: 'red' },
    { k: 'Tổng công trình sư', col: 'gold' },
    { k: '{{INPUT}}', col: 'gold' },
    { k: '5 khóa tọa độ', col: 'gold' },
  ];
  let rendered = false;
  for (const hlt of highlights) {
    if (str.includes(hlt.k)) {
      const idx = str.indexOf(hlt.k);
      const pre = str.slice(0, idx), kw = hlt.k, post = str.slice(idx + kw.length);
      const wPre = tw(pre, f), wKw = tw(kw, f);
      const startX = W/2 - totalW/2;
      txt(pre, startX, y, f, C.cream, 'left');
      sealBlock(startX + wPre - 6, y - h/2 + 6, wKw + 12, h - 12, hlt.col, p);
      txt(kw, startX + wPre + wKw/2, y, f, hlt.col === 'red' ? C.redTx : C.ink, 'center');
      txt(post, startX + wPre + wKw, y, f, C.cream, 'left');
      rendered = true;
      break;
    }
  }
  if (!rendered) {
    txt(str, W/2, y, f, C.cream, 'center');
  }
  g.restore();
}

// ══════ VO Timeline & Scene Map ══════
let VO = [], DUR = 140, SHOTS = [], EV = [];

function buildScenes() {
  if (!VO.length) return;
  DUR = Math.ceil(VO[VO.length-1].t1 + 3.5);

  SHOTS = [
    { id: 1, step: '00', title: 'NGHỊCH LÝ CÔNG THỨC', t0: 0,            t1: VO[1].t1+1.0 },
    { id: 2, step: '01', title: 'THU HẸP XÁC SUẤT',   t0: VO[2].t0-0.5, t1: VO[6].t1+1.2 },
    { id: 3, step: '02', title: 'TẤM GƯƠNG QUẢN TRỊ', t0: VO[7].t0-0.8, t1: VO[10].t1+1.2 },
    { id: 4, step: '03', title: 'TÁCH RỜI DÂY CHUYỀN', t0: VO[11].t0-0.8, t1: DUR },
  ];

  EV = [
    { t: 0.2, type: 'crt_open' },
    // Dramatic silence #1 before c07
    { t: VO[7].t0 - 0.75, dur: 0.75, type: 'silence' },
    { t: VO[7].t0 - 0.1, type: 'scan_sweep' },
    // Dramatic silence #2 before c11
    { t: VO[11].t0 - 0.75, dur: 0.75, type: 'silence' },
    { t: VO[11].t0 - 0.1, type: 'scan_sweep' },
    // End ding
    { t: VO[13].t0 + 2.5, type: 'okr_ding' },
  ];

  window.DUR = DUR;
  window.EV = EV;
}

function currentShot(t) {
  for (let i=SHOTS.length-1;i>=0;i--) if (t>=SHOTS[i].t0) return SHOTS[i];
  return SHOTS[0];
}

function currentCue(t) {
  for (let i=VO.length-1;i>=0;i--) if (t>=VO[i].t0 && t<VO[i].t1+1.5) return VO[i];
  return null;
}

// ══════ Scene 1: The Paradox (c00–c01) ══════
function drawScene1(t) {
  const c0 = VO[0], c1 = VO[1];
  if (!c0) return;
  // Central golden wheel
  const rot = t * 0.15;
  g.save(); g.translate(960, 440);
  circleP(0, 0, 240, 1, 1.5, 'rgba(229,207,149,0.3)');
  circleP(0, 0, 260, 1, 1.2, 'rgba(229,207,149,0.2)');
  for (let k = 0; k < 60; k++) {
    const an = rot + k * TAU / 60, r0 = 260, r1 = k % 5 === 0 ? 280 : 270;
    g.beginPath(); g.moveTo(Math.cos(an)*r0, Math.sin(an)*r0); g.lineTo(Math.cos(an)*r1, Math.sin(an)*r1);
    g.strokeStyle = 'rgba(229,207,149,0.35)'; g.stroke();
  }
  g.restore();

  // Heading: The Paradox
  revealText('NGHỊCH LÝ KHUNG PCTPR', 960, 220, font(900, 72, F.head), () => goldGrad(180, 260), t, c0.t0, { blur: 12, dy: 16 });
  // Two contrast cards: 9 Điểm vs Sáo rỗng
  if (t >= c0.t0 + 1.5) {
    const p = outC(P(t, c0.t0 + 1.5, 0.5));
    // Card A: 9/10
    sealBlock(320, 360, 540, 200, 'gold', p);
    txt('KẾT QUẢ 9/10 ĐIỂM', 590, 420, font(800, 36), C.ink);
    txt('Biết 3 tầng tư duy ẩn', 590, 480, font(600, 26), C.ink);
    // Card B: Sáo rỗng
    sealBlock(1060, 360, 540, 200, 'red', p);
    txt('VĂN MẪU SÁO RỖNG', 1330, 420, font(800, 36), C.redTx);
    txt('Điền đơn cho đủ 5 ô', 1330, 480, font(600, 26), C.redTx);
  }

  // Thesis statement at c01
  if (c1 && t >= c1.t0) {
    const q = outC(P(t, c1.t0, 0.6));
    g.save(); g.globalAlpha = q;
    txt('PCTPR KHÔNG PHẢI TỜ ĐƠN HÀNH CHÍNH', 960, 680, font(800, 40), C.gold);
    txt('ĐÂY LÀ 5 KHÓA TỌA ĐỘ THU HẸP ĐẠI DƯƠNG XÁC SUẤT', 960, 740, font(700, 34), C.cream);
    g.restore();
  }
}

// ══════ Scene 2: Layer 01 — Probability Ocean & 5 Locks (c02–c06) ══════
function drawScene2(t) {
  const c2 = VO[2];
  if (!c2) return;
  // Header
  txt('TẦNG ẨN 01: THU HẸP ĐẠI DƯƠNG XÁC SUẤT', 960, 160, font(900, 48, F.head), C.gold);

  // 5 Concentric Probability Rings (sized to clear the headline band y 137–183)
  const rings = [
    { letter: 'P', label: 'Persona · Khóa từ điển chuyên môn', r: 320, col: C.gold },
    { letter: 'C', label: 'Context · Neo biên giới thực tại', r: 260, col: C.line },
    { letter: 'T', label: 'Task · Động từ chuyển hóa sắc bén', r: 202, col: C.goldMid },
    { letter: 'P', label: 'Pattern · Giảm tải nhận thức người đọc', r: 144, col: C.coin2 },
    { letter: 'R', label: 'Rules · Không gian âm cắt suy diễn', r: 86, col: C.red },
  ];

  g.save(); g.translate(960, 540);
  rings.forEach((ring, idx) => {
    const ringP = outC(P(t, c2.t0 + idx*0.7, 0.6));
    if (ringP <= 0) return;
    g.save(); g.globalAlpha = ringP;
    // Circular ring stroke
    g.strokeStyle = ring.col; g.lineWidth = idx === 4 ? 3.5 : 2;
    g.beginPath(); g.arc(0, 0, ring.r, 0, TAU); g.stroke();
    // Crosshair ticks
    for (let i = 0; i < 4; i++) {
      const an = i * Math.PI / 2;
      g.beginPath(); g.moveTo(Math.cos(an)*(ring.r-8), Math.sin(an)*(ring.r-8));
      g.lineTo(Math.cos(an)*(ring.r+8), Math.sin(an)*(ring.r+8)); g.stroke();
    }
    // Ring tag on top
    const tagY = -ring.r;
    rrect(-24, tagY-16, 48, 32, 6);
    g.fillStyle = idx === 4 ? C.red : C.card; g.fill();
    g.strokeStyle = ring.col; g.lineWidth = 1.5; g.stroke();
    txt(ring.letter, 0, tagY, font(800, 20, F.mono), idx === 4 ? C.redTx : C.gold);
    g.restore();
  });

  // Crosshair center bullseye
  g.strokeStyle = C.goldHi; g.lineWidth = 2;
  g.beginPath(); g.moveTo(-20, 0); g.lineTo(20, 0); g.moveTo(0, -20); g.lineTo(0, 20); g.stroke();
  g.beginPath(); g.arc(0, 0, 14, 0, TAU); g.stroke();
  g.restore();

  // Special Highlight on [R — RULES] as "Negative Space" (c06)
  const c6 = VO[6];
  if (c6 && t >= c6.t0 - 0.2) {
    const ra = outC(P(t, c6.t0, 0.5));
    sealBlock(1160, 680, 660, 120, 'red', ra);
    txt('KHÔNG GIAN ÂM [R — RULES]', 1490, 720, font(800, 28), C.redTx);
    txt('Định nghĩa vùng cấm = Cắt bỏ 80% lan man!', 1490, 760, font(600, 22), C.redTx);
  }
}

// ══════ Scene 3: Layer 02 — Managerial Mirror & 4D Diagnosis (c07–c10) ══════
function drawScene3(t) {
  const c7 = VO[7];
  if (!c7) return;
  // Header
  txt('TẦNG ẨN 02: TẤM GƯƠNG NĂNG LỰC QUẢN TRỊ', 960, 160, font(900, 48, F.head), C.gold);

  // Transition message: Executor vs Systems Architect
  const c8 = VO[8];
  if (c8 && t >= c8.t0) {
    const ma = outC(P(t, c8.t0, 0.5));
    g.save(); g.globalAlpha = ma;
    // Left: Thợ làm tay
    rrect(200, 230, 700, 110, 12);
    g.fillStyle = C.card; g.fill(); g.strokeStyle = C.line3; g.lineWidth = 1.5; g.stroke();
    txt('THỢ LÀM TAY (EXECUTOR)', 550, 265, font(800, 26), C.gray);
    txt('Cặm cụi gõ chữ & sửa tay từng dòng', 550, 305, font(500, 22), C.gray2);

    // Right: Tổng công trình sư
    sealBlock(1020, 230, 700, 110, 'gold', ma);
    txt('TỔNG CÔNG TRÌNH SƯ (ARCHITECT)', 1370, 265, font(800, 26), C.ink);
    txt('Thiết kế đề bài & Nghiệm thu chất lượng', 1370, 305, font(600, 22), C.ink);
    g.restore();
  }

  // 4-Dimensional Diagnostic Board (c09–c10)
  const c9 = VO[9];
  if (c9 && t >= c9.t0 - 0.2) {
    const ba = outC(P(t, c9.t0, 0.5));
    g.save(); g.globalAlpha = ba;
    txt('BẢNG BẮT BỆNH HỆ THỐNG (KHÔNG SỬA TAY)', 960, 400, font(800, 32, F.head), C.cream);

    const diags = [
      { sym: 'Sai giọng điệu / Thiếu sâu', fix: 'Chỉnh [P — Persona]', col: C.gold },
      { sym: 'Lạc thực tế doanh nghiệp', fix: 'Bổ sung [C — Context]', col: C.line },
      { sym: 'Trình bày rối / Khó đọc', fix: 'Siết khuôn [P — Pattern]', col: C.coin2 },
      { sym: 'Bịa số liệu / Dài dòng', fix: 'Khóa chặt [R — Rules]', col: C.red },
    ];

    diags.forEach((d, i) => {
      const da = outC(P(t, c9.t0 + 0.8 + i*0.4, 0.4));
      if (da <= 0) return;
      const y = 460 + i*90;
      g.save(); g.globalAlpha = da;
      rrect(200, y, 1520, 75, 10);
      g.fillStyle = C.card; g.fill();
      g.strokeStyle = d.col; g.lineWidth = 2; g.stroke();
      txt('TRIỆU CHỨNG: ' + d.sym, 260, y+38, font(600, 24), C.cream, 'left');
      // Arrow
      txt('➔', 1060, y+38, font(700, 26), C.gold, 'center');
      // Fix
      txt('ĐIỀU CHỈNH: ' + d.fix, 1140, y+38, font(800, 26), d.col, 'left');
      g.restore();
    });
    g.restore();
  }
}

// ══════ Scene 4: Layer 03 — System vs Data Separation (c11–c13) ══════
function drawScene4(t) {
  const c11 = VO[11];
  if (!c11) return;
  // Header
  txt('TẦNG ẨN 03: TÁCH KHUÔN HỆ THỐNG VÀ DỮ LIỆU', 960, 160, font(900, 48, F.head), C.gold);

  // Separation Machine Illustration
  const pa = outC(P(t, c11.t0, 0.5));
  g.save(); g.globalAlpha = pa;

  // Box 1: Reusable PCTPR Mold
  rrect(220, 260, 680, 360, 16);
  g.fillStyle = C.card; g.fill();
  g.strokeStyle = C.gold; g.lineWidth = 3; g.stroke();
  txt('DÂY CHUYỀN CỐ ĐỊNH (SYSTEM)', 560, 310, font(800, 30, F.mono), C.gold);
  const blocks = ['[P — PERSONA]', '[C — CONTEXT]', '[T — TASK]', '[P — PATTERN]', '[R — RULES]'];
  blocks.forEach((b, i) => {
    rrect(280, 360 + i*46, 560, 38, 6);
    g.fillStyle = 'rgba(229,207,149,0.12)'; g.fill();
    txt(b, 560, 380 + i*46, font(700, 20, F.mono), C.goldHi);
  });

  // Plus icon
  txt('+', 960, 440, font(900, 64, F.mono), C.gold);

  // Box 2: Dynamic Input Data
  rrect(1020, 260, 680, 360, 16);
  g.fillStyle = C.card; g.fill();
  g.strokeStyle = C.coin3; g.lineWidth = 3; g.stroke();
  txt('DỮ LIỆU LƯU ĐỘNG (DATA)', 1360, 310, font(800, 30, F.mono), C.coin1);
  rrect(1080, 390, 560, 140, 10);
  g.fillStyle = 'rgba(205,172,106,0.15)'; g.fill();
  g.strokeStyle = C.coin2; g.lineWidth = 2; g.setLineDash([8,6]); g.stroke(); g.setLineDash([]);
  txt('[INPUT]', 1360, 435, font(800, 24, F.mono), C.coin1);
  txt('{{DỮ_LIỆU_CẦN_XỬ_LÝ}}', 1360, 485, font(700, 28, F.mono), C.goldHi);
  g.restore();

  // Grand Closing Statement (c12–c13)
  const c12 = VO[12];
  if (c12 && t >= c12.t0) {
    const qa = outC(P(t, c12.t0, 0.5));
    sealBlock(320, 680, 1280, 120, 'gold', qa);
    txt('RÈN KHUÔN 1 LẦN — TÁI SỬ DỤNG 100 LẦN CHO CẢ PHÒNG BAN', 960, 725, font(800, 34), C.ink);
    txt('LÀM CHỦ AI BẰNG BẢN LĨNH CỦA NGƯỜI ĐIỀU PHỐI HỆ THỐNG', 960, 765, font(700, 26), C.ink);
  }
}

// ══════ Main render ══════
function render(t) {
  g.save();
  // Cosmos background base
  g.drawImage(BG, 0, 0);

  // Ambient stardust, coordinate grid, golden orbits
  drawAmbient(t);

  // Warm central glow
  const br = Math.sin(t * TAU / 3.6);
  glowAt(960, 460, 800 * (1 + 0.04*br), 540 * (1 + 0.04*br), 0.85 + 0.15*br);

  // Current Scene
  const shot = currentShot(t);
  if (shot) {
    if (shot.id === 1) drawScene1(t);
    else if (shot.id === 2) drawScene2(t);
    else if (shot.id === 3) drawScene3(t);
    else if (shot.id === 4) drawScene4(t);
    drawHUD(t, shot.step, shot.title);
  }

  // Vignette overlay
  g.drawImage(VIG, 0, 0);

  // Subtitle band & text
  if (!NOSUB) g.drawImage(SUBBAND, 0, H - 240);
  const cue = currentCue(t);
  if (cue) drawSubtitle(t, cue);

  // CRT power-on at t=0..0.4
  if (t < 0.4) {
    const p = outC(t / 0.4);
    g.save(); g.fillStyle = '#020305'; g.globalAlpha = 1 - p;
    g.fillRect(0, 0, W, H); g.restore();
  }

  // Fade out at end
  const fadeA = P(t, DUR - 2.0, 1.5);
  if (fadeA > 0) {
    g.fillStyle = C.bg0; g.globalAlpha = fadeA; g.fillRect(0, 0, W, H);
  }

  g.restore();
}

window.render = render;
window.seek = render;

  document.fonts.load('700 20px "JBMono"', SAMPLE_VI),
  fetch('./vo/vo_timeline.json').then(r => r.ok ? r.json() : []).catch(() => []),

  await document.fonts.ready;

  buildScenes();
  render(0);
  window.READY = true;
  window.ready = true;
});
