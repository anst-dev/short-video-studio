<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Giải Mã 7 Khái Niệm AI Cơ Bản Để Áp Dụng Ngay Vào Công Việc — Dashi Flowchart</title>
<style>
@font-face {
  font-family: 'BeVietnamPro';
  src: url('./fonts/BeVietnamPro-Regular.ttf') format('truetype');
  font-weight: 400;
}
@font-face {
  font-family: 'BeVietnamPro';
  src: url('./fonts/BeVietnamPro-Medium.ttf') format('truetype');
  font-weight: 500;
}
@font-face {
  font-family: 'BeVietnamPro';
  src: url('./fonts/BeVietnamPro-Bold.ttf') format('truetype');
  font-weight: 600 700;
}
@font-face {
  font-family: 'BeVietnamPro';
  src: url('./fonts/BeVietnamPro-ExtraBold.ttf') format('truetype');
  font-weight: 800 900;
}
@font-face {
  font-family: 'JBMono';
  src: url('./fonts/JetBrainsMono-var.ttf') format('truetype');
  font-weight: 100 800;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fcf9ec; }
canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="./fx_dashi.js"></script>
<script>
'use strict';
const W = 1920, H = 1080, TAU = Math.PI * 2;
const cv = document.getElementById('c');
const g = cv.getContext('2d');
const NOSUB = /[?&]nosub=1/.test(location.search);

// Authentic Dashi 扁平流程图 Palette (`styles/扁平流程图/风格卡.md`)
const C = {
  bg: '#fcf9ec',
  paper: '#fffdf6',
  amber: '#fbbf2f',
  amber2: '#f7a30e',
  amberD: '#e08a06',
  amberL: '#fde7a0',
  ring: '#efe8d6',
  shadow: '#efe3c2',
  ink: '#1a1410',
  ink2: '#2b241b',
  mute: '#6b6254',
  red: '#d41928',
  redSoft: '#fee2e2',
  blue: '#2373ce',
  blueSoft: '#dbeafe',
  orange: '#ee8013',
  green: '#3d8b29',
  greenSoft: '#dcfce7',
  gold: '#d98e04',
  pill: '#f5eedb',
};

const F_SANS = '"BeVietnamPro"';
const F_MONO = '"JBMono"';
const font = (w, s) => `${w} ${s}px ${F_SANS}`;
const mono = (w, s) => `${w} ${s}px ${F_MONO}`;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const P = (t, a, d) => clamp((t - a) / Math.max(0.001, d));
const outC = (p) => 1 - Math.pow(1 - p, 3);
const inOutC = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const outBack = (p) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const sine = (p) => 0.5 - 0.5 * Math.cos(Math.PI * p);
const qb = (a, c, b, u) => (1 - u) * (1 - u) * a + 2 * (1 - u) * u * c + u * u * b;
function hex(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, p) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * p)).join(',')})`; }
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function txt(s, x, y, f, col = C.ink, align = 'center', base = 'middle') {
  g.font = f; g.fillStyle = col; g.textAlign = align; g.textBaseline = base; g.fillText(s, x, y);
}
function tw(s, f) { g.font = f; return g.measureText(s).width; }
function popS(t, t0, d = 0.38) { return outBack(P(t, t0, d)); }
function popA(t, t0, d = 0.38) { return P(t, t0, d * 0.45); }

function wrapWords(str, fStr, maxW) {
  g.font = fStr;
  const words = str.split(' ');
  const out = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (g.measureText(test).width > maxW && cur) { out.push(cur); cur = w; }
    else cur = test;
  }
  if (cur) out.push(cur);
  return out;
}

// ── Reusable Dashi 扁平流程图 Primitives ──
function badge(x, y, n, s = 1, a = 1) {
  if (a <= 0) return;
  g.save(); g.globalAlpha *= a; g.translate(x, y); g.scale(s, s);
  g.fillStyle = C.amber2;
  g.beginPath(); g.moveTo(22, -16); g.lineTo(46, 0); g.lineTo(22, 16); g.closePath(); g.fill();
  g.fillStyle = C.amber;
  g.beginPath(); g.arc(0, 0, 30, 0, TAU); g.fill();
  txt(String(n), 0, 2, font(800, 32), '#ffffff');
  g.restore();
}

function stepLabel(x, y, n, title, subtitle, t0, t) {
  const a = popA(t, t0); if (a <= 0) return;
  const s = 0.65 + 0.35 * popS(t, t0);
  g.save(); g.globalAlpha = a;
  badge(x, y, n, s);
  txt(title, x + 66, y - 6, font(800, 38), C.ink, 'left');
  if (subtitle) txt(subtitle, x + 66, y + 32, font(500, 22), C.mute, 'left');
  g.restore();
}

function arrow(x0, y0, cx, cy, x1, y1, p, w = 16) {
  if (p <= 0) return;
  const N = 56, pts = [];
  for (let i = 0; i <= N * p; i++) { const u = i / N; pts.push([qb(x0, cx, x1, u), qb(y0, cy, y1, u)]); }
  const u = p, ex = qb(x0, cx, x1, u), ey = qb(y0, cy, y1, u);
  const dx = 2 * (1 - u) * (cx - x0) + 2 * u * (x1 - cx), dy = 2 * (1 - u) * (cy - y0) + 2 * u * (y1 - cy);
  const L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
  const gr = g.createLinearGradient(x0, y0, ex, ey);
  gr.addColorStop(0, 'rgba(252,236,190,0)'); gr.addColorStop(0.35, '#fbe3a0'); gr.addColorStop(1, C.amber2);
  const hl = w * 2.1;
  g.strokeStyle = gr; g.lineWidth = w; g.lineCap = 'butt'; g.lineJoin = 'round';
  g.beginPath(); pts.forEach(([px, py], i) => (i ? g.lineTo(px, py) : g.moveTo(px, py)));
  g.lineTo(ex - ux * hl * 0.6, ey - uy * hl * 0.6); g.stroke();
  g.fillStyle = C.amber2; g.beginPath();
  g.moveTo(ex + ux * hl * 0.55, ey + uy * hl * 0.55);
  g.lineTo(ex - ux * hl * 0.7 - uy * hl * 0.85, ey - uy * hl * 0.7 + ux * hl * 0.85);
  g.lineTo(ex - ux * hl * 0.7 + uy * hl * 0.85, ey - uy * hl * 0.7 - ux * hl * 0.85);
  g.closePath(); g.fill();
}

function arrowFlow(x0, y0, cx, cy, x1, y1, t, t0) {
  if (t < t0) return;
  const u = ((t - t0) / 1.5) % 1, k = 0.12 + 0.78 * u;
  g.save(); g.globalAlpha *= Math.sin(Math.PI * u); g.fillStyle = '#fffdf6';
  g.beginPath(); g.arc(qb(x0, cx, x1, k), qb(y0, cy, y1, k), 7, 0, TAU); g.fill();
  g.restore();
}

function panelCard(x, y, w, h, { headBg = C.amber, headFg = C.ink, headTxt = '', bg = C.paper, border = '#edd799', title = '', bullets = [], t0 = 0, t = 0 }) {
  const a = popA(t, t0); if (a <= 0) return;
  const sc = 0.88 + 0.12 * popS(t, t0);
  g.save();
  g.globalAlpha *= a;
  g.translate(x + w / 2, y + h / 2); g.scale(sc, sc); g.translate(-(x + w / 2), -(y + h / 2));

  // Unblurred offset shadow (`风格卡.md`: 向右下错开 8–10 像素、不模糊)
  g.fillStyle = C.shadow; rrect(x + 8, y + 10, w, h, 24); g.fill();
  g.fillStyle = bg; rrect(x, y, w, h, 24); g.fill();

  g.save(); rrect(x, y, w, h, 24); g.clip();
  g.fillStyle = headBg; g.fillRect(x, y, w, 54);
  g.restore();

  g.strokeStyle = border; g.lineWidth = 3; rrect(x, y, w, h, 24); g.stroke();
  txt(headTxt, x + 24, y + 28, font(800, 21), headFg, 'left');
  for (let d = 0; d < 3; d++) {
    g.fillStyle = headFg === '#ffffff' ? 'rgba(255,255,255,0.45)' : 'rgba(26,20,16,0.32)';
    g.beginPath(); g.arc(x + w - 28 - d * 18, y + 27, 5, 0, TAU); g.fill();
  }

  let cy = y + 86;
  if (title) {
    const tf = font(800, 25);
    const tls = wrapWords(title, tf, w - 48);
    tls.forEach(ln => { txt(ln, x + 24, cy, tf, C.ink, 'left'); cy += 33; });
    g.strokeStyle = C.ring; g.lineWidth = 2;
    g.beginPath(); g.moveTo(x + 24, cy - 8); g.lineTo(x + w - 24, cy - 8); g.stroke();
    cy += 12;
  }
  const bf = font(500, 21.5);
  bullets.forEach(b => {
    const bls = wrapWords(b, bf, w - 48);
    bls.forEach((ln, li) => {
      if (cy < y + h - 18) {
        txt(ln, x + (li === 0 ? 24 : 42), cy, bf, '#2b241b', 'left');
        cy += 30;
      }
    });
    cy += 8;
  });
  g.restore();
}

function tokenChip(label, x, y, col, t0, t) {
  const a = popA(t, t0), s = popS(t, t0);
  if (a <= 0 || s <= 0) return 0;
  const f = font(800, 28);
  const w = tw(label, f) + 44, h = 68;
  const bob = 4 * Math.sin(t * 2.6 + x * 0.01) * P(t, t0 + 0.4, 0.3);
  g.save(); g.globalAlpha *= a; g.translate(x + w / 2, y + h / 2 + bob); g.scale(s, s);
  g.fillStyle = mix(col, '#000000', 0.24); rrect(-w / 2, -h / 2 + 6, w, h, 16); g.fill();
  g.fillStyle = col; rrect(-w / 2, -h / 2, w, h, 16); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.18)'; rrect(-w / 2 + 6, -h / 2 + 5, w - 12, h * 0.36, 10); g.fill();
  txt(label, 0, 2, f, '#ffffff');
  g.restore();
  return w;
}

function amberCallout(x, y, w, h, line1, line2, t0, t) {
  const p = P(t, t0, 0.45);
  if (p <= 0) return;
  const f1 = font(800, 23.5), f2 = font(600, 19.5);
  const autoW = Math.max(w, tw(line1, f1) + 72, line2 ? tw(line2, f2) + 72 : 0);
  const cx = x + w / 2;
  const s = 0.78 + 0.22 * outBack(p);
  g.save(); g.globalAlpha *= clamp(p * 2.2);
  g.translate(cx, y + h / 2); g.scale(s, s);
  g.fillStyle = C.shadow; rrect(-autoW / 2 + 6, -h / 2 + 8, autoW, h, 16); g.fill();
  g.fillStyle = C.amber; rrect(-autoW / 2, -h / 2, autoW, h, 16); g.fill();
  txt(line1, 0, line2 ? -15 : 2, f1, C.ink);
  if (line2) txt(line2, 0, 19, f2, '#3b2e14');
  g.restore();
}

// ── Ambient Background Layers (`drawRings` + `drawShapes` from `扁平流程图/模板.html`) ──
const BG_COLS = ['#f8e2a6', '#f6d9bd', '#dcead0', '#efe3c2', '#fbe9b8'];
const SHAPES = Array.from({ length: 28 }, (_, i) => {
  const h = (k) => window.动效 ? window.动效.hash(i * 9.13 + k * 3.71) : ((Math.sin(i * 12.9898 + k * 78.233) * 43758.5453) % 1 + 1) % 1;
  return { x: h(1) * 2300, y: 145 + h(2) * 700, r: 10 + h(3) * 20, kind: Math.floor(h(4) * 5), col: BG_COLS[Math.floor(h(5) * BG_COLS.length)], ph: h(6) * TAU, spin: (h(7) - 0.5) * 1.1, v: 9 + h(8) * 13 };
});

function drawRings(cam, centers, t) {
  g.strokeStyle = C.ring; g.lineCap = 'round';
  centers.forEach(([sx, sy], i) => {
    const x = (sx - cam.x) * 0.5 + 960, y = (sy - cam.y) * 0.5 + 505;
    if (x < -460 || x > W + 460) return;
    g.strokeStyle = C.ring; g.lineWidth = 4; g.beginPath(); g.arc(x, y, 370, 0, TAU); g.stroke();
    g.lineWidth = 11;
    const rot = t * 0.12 + i * 0.4;
    for (let k = 0; k < 12; k++) {
      const a = k * TAU / 12 - Math.PI / 2 + rot, r0 = 305, r1 = k % 3 === 0 ? 346 : 334;
      g.beginPath(); g.moveTo(x + Math.cos(a) * r0, y + Math.sin(a) * r0); g.lineTo(x + Math.cos(a) * r1, y + Math.sin(a) * r1); g.stroke();
    }
    const hs = t * 0.85 + i * 1.7, hm = t * 0.14 + i * 2.3;
    g.strokeStyle = C.shadow; g.lineWidth = 9;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(hm) * 175, y + Math.sin(hm) * 175); g.stroke();
    g.lineWidth = 5.5;
    g.beginPath(); g.moveTo(x - Math.cos(hs) * 36, y - Math.sin(hs) * 36); g.lineTo(x + Math.cos(hs) * 265, y + Math.sin(hs) * 265); g.stroke();
    g.fillStyle = C.shadow; g.beginPath(); g.arc(x, y, 14, 0, TAU); g.fill();
  });
}

function drawShapes(t, cam) {
  const mod = (v, m) => ((v % m) + m) % m;
  for (const s of SHAPES) {
    const x = mod(s.x - cam.x * 0.3 - s.v * t, 2300) - 190;
    const y = s.y + 8 * Math.sin(0.9 * t + s.ph);
    if (y > 865 || y < 128) continue;
    g.save(); g.translate(x, y); g.rotate(s.ph + s.spin * t); g.fillStyle = s.col; g.strokeStyle = s.col;
    const r = s.r;
    if (s.kind === 0) { g.beginPath(); g.arc(0, 0, r, 0, TAU); g.fill(); }
    else if (s.kind === 1) { g.lineWidth = 6; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.stroke(); }
    else if (s.kind === 2) { rrect(-r, -r, 2 * r, 2 * r, r * 0.35); g.fill(); }
    else if (s.kind === 3) { const a = r * 0.34; g.fillRect(-r, -a, 2 * r, 2 * a); g.fillRect(-a, -r, 2 * a, 2 * r); }
    else { g.beginPath(); g.moveTo(0, -r); g.lineTo(r * 0.9, r * 0.6); g.lineTo(-r * 0.9, r * 0.6); g.closePath(); g.fill(); }
    g.restore();
  }
}

// ── Timeline & 7 Horizontal Stations (`STEP_X = 2100`) ──
let VO = [];
let DUR = 160.0;
let SHOTS = [];
const STEP_X = 2100;

function buildTimelineFromVO(voList) {
  const ct = (idx, fallback) => (voList[idx] ? voList[idx].t0 : fallback);
  const lastEnd = voList.length ? voList[voList.length - 1].t1 : 156.0;
  DUR = Math.ceil(lastEnd + 2.8);

  // Map the 16 cues cleanly onto our 7 numbered stations!
  const starts = [
    0.0,
    Math.max(26.0, ct(3, 28.2) - 0.35),
    Math.max(45.0, ct(5, 47.2) - 0.35),
    Math.max(65.0, ct(7, 67.5) - 0.35),
    Math.max(86.0, ct(9, 88.2) - 0.35),
    Math.max(105.0, ct(11, 107.6) - 0.35),
    Math.max(126.0, ct(13, 128.8) - 0.35),
  ];

  const titles = [
    ['MÔ HÌNH NGÔN NGỮ LỚN (LLM)', 'Cỗ máy dự đoán từ tiếp theo như Thủ thư đọc cả thư viện'],
    ['TOKEN — ĐƠN VỊ ĐỌC & TÍNH PHÍ', 'Từng viên gạch câu chữ · Mẹo làm sạch bảng tính trước khi gửi'],
    ['CỬA SỔ NGỮ CẢNH (CONTEXT WINDOW)', 'Chiếc bàn trí nhớ ngắn hạn · Mỗi việc mở một cửa sổ chat riêng'],
    ['ẢO GIÁC AI (HALLUCINATION) & RAG', 'Cạm bẫy tự bịa số liệu & Cách khóa chặt bằng tài liệu gốc'],
    ['SYSTEM PROMPT & TRỢ LÝ CHUYÊN BIỆT', 'Đóng gói sẵn GPTs / Gems cho các đầu việc lặp lại hàng tuần'],
    ['ĐA PHƯƠNG THỨC & PHỐI HỢP CÔNG CỤ', 'Đọc ảnh hóa đơn · Nghe họp · Phân vai ChatGPT, Claude, Gemini'],
    ['NGUYÊN TẮC VÀNG 80/20 & BẢO MẬT', '80% AI chạy nháp · 20% Con người kiểm chứng & bảo vệ dữ liệu mật'],
  ];

  SHOTS = starts.map((s0, idx) => ({
    idx,
    num: idx + 1,
    cx: 960 + idx * STEP_X,
    t0: s0,
    t1: idx + 1 < starts.length ? starts[idx + 1] : DUR,
    title: titles[idx][0],
    sub: titles[idx][1],
    tMid: ct([2, 4, 6, 8, 10, 12, 14][idx], s0 + 9.0),
  }));

  // Build deterministic foley & dramatic silence events (`window.EV`)
  const EV = [];
  SHOTS.forEach((sh, idx) => {
    EV.push({ t: +(sh.t0 + 0.12).toFixed(3), type: 'station_pop' });
    EV.push({ t: +(sh.tMid + 0.10).toFixed(3), type: 'chip_pop' });
    if (idx > 0) EV.push({ t: +Math.max(0.05, sh.t0 - 0.25).toFixed(3), type: 'arrow_whoosh' });
  });
  // Extra token pops at Station 2
  for (let k = 0; k < 6; k++) EV.push({ t: +(SHOTS[1].t0 + 0.8 + k * 0.22).toFixed(3), type: 'chip_pop' });
  // Warning thump on Hallucination (Station 4) & Ding on RAG + 80/20 Finale (Station 4 & 7)
  EV.push({ t: +(SHOTS[3].t0 + 0.65).toFixed(3), type: 'warn_thump' });
  EV.push({ t: +(SHOTS[3].tMid + 0.35).toFixed(3), type: 'stamp_ding' });
  EV.push({ t: +(SHOTS[6].t0 + 0.70).toFixed(3), type: 'stamp_ding' });
  EV.push({ t: +(ct(15, DUR - 8.0) + 0.25).toFixed(3), type: 'stamp_ding' });

  // 2 Planned Dramatic Silences before Station 4 (Hallucination Turn) & Station 7 (80/20 Payoff)
  EV.push(
    { t: +(SHOTS[3].t0 - 0.85).toFixed(3), dur: 0.80, type: 'silence' },
    { t: +(SHOTS[6].t0 - 0.85).toFixed(3), dur: 0.80, type: 'silence' }
  );
  EV.sort((a, b) => a.t - b.t);
  window.DUR = DUR;
  window.DURATION = DUR;
  window.EV = EV;
}

// Transition kinds across the 6 cuts:
// Cut 0..1..2: Horizontal Flow Pan, Cut 2 (into St 4 Hallucination): Amber Chevron Sweep,
// Cut 3..4: Horizontal Flow Pan, Cut 5 (into St 7 Finale): Iris Mask!
function cutKind(cutIdx) {
  if (cutIdx === 2) return 'sweep';
  if (cutIdx === 5) return 'iris';
  return 'pan';
}

function camAt(t) {
  let x = SHOTS[0].cx;
  for (let i = 1; i < SHOTS.length; i++) {
    const cutT = SHOTS[i].t0;
    const kind = cutKind(i - 1);
    const p = kind === 'pan' ? inOutC(P(t, cutT - 0.35, 0.70)) : (t >= cutT ? 1 : 0);
    x = lerp(x, SHOTS[i].cx, p);
  }
  // Gentle continuous breathing drift within each station so picture is ALWAYS alive
  const drift = 18 * Math.sin(t * 0.55);
  const zoom = 1.0 + 0.025 * Math.sin(t * 0.45);
  return { x: x + drift, y: 505, z: zoom };
}

// ── Draw Each of the 7 Visual Stations (`y` strictly within `142..855`) ──
function drawAllStations(t, cam) {
  // Curved flow arrows + flowing pearls between adjacent stations
  for (let i = 1; i < SHOTS.length; i++) {
    const A = SHOTS[i - 1], B = SHOTS[i];
    if (Math.abs((A.cx + B.cx) / 2 - cam.x) > 2200) continue;
    const ar = [A.cx + 760, 520, (A.cx + B.cx) / 2, 360, B.cx - 760, 520];
    arrow(...ar, outC(P(t, B.t0 - 0.35, 0.60)), 16);
    arrowFlow(...ar, t, B.t0 + 0.25);
  }

  for (const sh of SHOTS) {
    if (Math.abs(sh.cx - cam.x) > 1950) continue;
    const cx = sh.cx;
    stepLabel(cx - 760, 185, sh.num, sh.title, sh.sub, sh.t0 + 0.08, t);

    if (sh.idx === 0) {
      // STATION 1: LLM Next-Word Predictor + Librarian Workplace Uses
      panelCard(cx - 760, 265, 735, 420, {
        headBg: C.amber, headFg: C.ink, headTxt: 'BẢN CHẤT BÊN TRONG MÔ HÌNH NGÔN NGỮ LỚN (LLM)',
        title: 'Đọc ngữ cảnh đằng trước → Tính xác suất từ hợp lý tiếp theo!',
        bullets: [
          'Câu đang gõ: “Căn cứ Biên bản họp 18/11, đề nghị phòng...”',
          '▸ Dự đoán #1: “Kế toán đối chiếu công nợ”  —  84%',
          '▸ Dự đoán #2: “Nhân sự tổng hợp danh sách”  —  11%',
          '▸ Dự đoán #3: “Kinh doanh rà soát hợp đồng”  —   5%',
        ],
        t0: sh.t0 + 0.35, t
      });
      panelCard(cx + 25, 265, 735, 420, {
        headBg: C.blue, headFg: '#ffffff', headTxt: 'ỨNG DỤNG NGAY: “THỦ THƯ ĐỌC CẢ THƯ VIỆN”',
        title: 'Việc gì có mẫu chung, AI làm nhanh gấp 5–10 lần:',
        bullets: [

// ── Screen-Space Dashi Transitions (`fxSweep` & `fxIris`, `y: 104..880`) ──
const FX_Y0 = 104, FX_Y1 = 880;
function fxIris(R) {
  g.fillStyle = C.amber;
  g.beginPath(); g.rect(0, FX_Y0, W, FX_Y1 - FX_Y0);
  if (R > 0) g.arc(960, 500, R, 0, TAU, true);
  g.fill('evenodd');
  if (R > 0) {
    g.lineWidth = 14; g.strokeStyle = C.shadow; g.beginPath(); g.arc(966, 508, R + 7, 0, TAU); g.stroke();
    g.strokeStyle = C.amber2; g.beginPath(); g.arc(960, 500, R + 7, 0, TAU); g.stroke();
  }
}

function fxSweep(t, c) {
  const lead = lerp(-260, W + 260, inOutC(P(t, c - 0.34, 0.34)));
  const tail = lerp(-260, W + 260, inOutC(P(t, c + 0.04, 0.36)));
  const sl = 140;
  const band = (x0, x1, col) => {
    if (x1 <= x0) return;
    g.fillStyle = col; g.beginPath();
    g.moveTo(x0 + sl, FX_Y0); g.lineTo(x1 + sl, FX_Y0); g.lineTo(x1 - sl, FX_Y1); g.lineTo(x0 - sl, FX_Y1);
    g.closePath(); g.fill();
  };
  band(tail - 55, lead + 55, C.shadow);
  band(tail, lead, C.amber);
  band(lead - 44, lead, C.amber2);
}

function drawTransitions(t) {
  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.beginPath(); g.rect(0, FX_Y0, W, FX_Y1 - FX_Y0); g.clip();
  if (t < 0.65) fxIris(1120 * outC(P(t, 0, 0.65)));
  for (let i = 1; i < SHOTS.length; i++) {
    const c = SHOTS[i].t0, kind = cutKind(i - 1);
    if (t < c - 0.36 || t > c + 0.46) continue;
    if (kind === 'sweep') fxSweep(t, c);
    else if (kind === 'iris') fxIris(t < c ? 1120 * (1 - Math.pow(P(t, c - 0.32, 0.32), 3)) : 1120 * outC(P(t, c, 0.42)));
  }
  g.restore();
}

// ── Fixed Amber Top Header Band + Station Progress Indicator ──
function drawHeader(t) {
  g.fillStyle = C.amber; g.fillRect(0, 0, W, 104);
  g.fillStyle = 'rgba(160,100,0,0.12)'; g.fillRect(0, 104, W, 5);
  txt('GIẢI MÃ 7 KHÁI NIỆM AI CƠ BẢN ĐỂ ÁP DỤNG VÀO CÔNG VIỆC', 76, 54, font(800, 36), C.ink, 'left');

  // 7 numbered progress dots on right side of header band
  let activeIdx = 0;
  SHOTS.forEach((sh, i) => { if (t >= sh.t0 - 0.05) activeIdx = i; });
  for (let i = 0; i < 7; i++) {
    const px = W - 360 + i * 48, py = 52;
    const on = i <= activeIdx, cur = i === activeIdx;
    g.fillStyle = cur ? C.ink : (on ? C.amberD : 'rgba(255,255,255,0.55)');
    g.beginPath(); g.arc(px, py, cur ? 18 : 15, 0, TAU); g.fill();
    txt(String(i + 1), px, py + 1, mono(800, cur ? 17 : 15), cur || on ? '#ffffff' : C.ink);
  }
}

// ── Clean Word-Wrapped Vietnamese Bottom Caption (`y: 896..1050`, respects `?nosub=1`) ──
function drawSubtitle(t) {
  if (NOSUB) return;
  const cue = VO.find(q => t >= q.c0 && t < q.c1);
  if (!cue) return;
  const a = Math.min(P(t, cue.c0, 0.12), 1 - P(t, cue.c1 - 0.12, 0.12));
  if (a <= 0) return;

  const f = font(700, 30);
  const lines = wrapWords(cue.sub, f, 1680);
  const boxW = Math.max(...lines.map(l => tw(l, f))) + 64;
  const boxH = lines.length === 1 ? 64 : 102;
  const x = (W - boxW) / 2, y = 968 - boxH / 2;

  g.save();
  g.globalAlpha = outC(a);
  g.fillStyle = C.shadow; rrect(x + 5, y + 6, boxW, boxH, 16); g.fill();
  g.fillStyle = C.paper; rrect(x, y, boxW, boxH, 16); g.fill();
  g.strokeStyle = C.amber2; g.lineWidth = 2.5; rrect(x, y, boxW, boxH, 16); g.stroke();
  lines.forEach((ln, idx) => {
    const ly = lines.length === 1 ? y + boxH / 2 + 1 : y + 31 + idx * 38;
    txt(ln, W / 2, ly, f, C.ink);
  });
  g.restore();
}

function renderFrame(t) {
  t = clamp(t, 0, DUR);
  if (window.动效 && window.动效.resetCtx) window.动效.resetCtx(g);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 1;
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);

  if (!SHOTS.length) return;
  const cam = camAt(t);
  drawRings(cam, SHOTS.map(s => [s.cx + 380, 520]), t);
  drawShapes(t, cam);

  g.save();
  g.setTransform(cam.z, 0, 0, cam.z, 960 - cam.x * cam.z, 505 - cam.y * cam.z);
  drawAllStations(t, cam);
  g.restore();

  drawTransitions(t);
  drawHeader(t);
  drawSubtitle(t);
}

window.render = renderFrame;
window.seek = renderFrame;

const SAMPLE_VI = 'Giải Mã 7 Khái Niệm AI Cơ Bản Để Áp Dụng Vào Công Việc Ảo giác Cửa sổ Ngữ cảnh 80/20';

]).then(async ([,,,, vo]) => {
  await document.fonts.ready;
  buildTimelineFromVO(vo || []);
  VO = (vo || []).map((c, idx, arr) => {
    const nextT0 = idx + 1 < arr.length ? arr[idx + 1].t0 - 0.10 : DUR - 0.15;
    const c0 = Math.max(0.05, c.t0 - 0.06);
    const c1 = Math.min(nextT0, Math.max(c.t1 + 0.50, c0 + 1.85));
    return { ...c, c0, c1 };
  });
  renderFrame(0);
  window.READY = true;
  window.ready = true;
});
