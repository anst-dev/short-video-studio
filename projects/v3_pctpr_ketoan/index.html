function rect(x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function line(x0, y0, x1, y1, c, lw = 1) { g.strokeStyle = c; g.lineWidth = lw; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke(); }
function text(s, x, y, f, c = INK, align = 'left', base = 'middle') { g.font = f; g.fillStyle = c; g.textAlign = align; g.textBaseline = base; g.fillText(s, x, y); }
function tw(s, f) { g.font = f; return g.measureText(s).width; }
function colName(i) { let s = '', n = i + 1; while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n - 1) / 26); } return s; }
function popK(t, t0, dur = 0.25, amp = 0.22) { const dt = t - t0; if (dt < 0 || dt > dur) return 1; return 1 + amp * Math.sin(Math.PI * dt / dur); }
function hexMix(a, b, u) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = s => Math.round(lerp((pa >> s) & 255, (pb >> s) & 255, clamp(u, 0, 1)));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}
function wrapLines(str, fontStr, maxW) {
  g.font = fontStr;
  const words = str.split(' ');
  const out = [];
  let cur = '';
  for (const w of words) {
    const cand = cur ? cur + ' ' + w : w;
    if (g.measureText(cand).width > maxW && cur) {
      out.push(cur);
      cur = w;
    } else {
      cur = cand;
    }
  }
  if (cur) out.push(cur);
  return out;
}

  for (let i = 0; i <= NC; i++) colPrefix[i + 1] = colPrefix[i] + colWidths[i];

let CAM = { x: 0, y: 0, z: 1 }, HDR = 28, SHEET_Y = 152, VW = 1864, VH = 868, VCX = 960, VCY = 540;
function evalCamera(t) {
  let k = 0;
  while (k < CAM_KEYS.length - 2 && t >= CAM_KEYS[k + 1].t) k++;
  const A = CAM_KEYS[k], B = CAM_KEYS[k + 1];
  const u = eio(seg(t, A.t, B.t));
  const z = Math.exp(lerp(Math.log(A.z), Math.log(B.z), u));
  const c = lerp(A.c, B.c, u), r = lerp(A.r, B.r, u);
  return { x: colXf(c), y: r * RH, z };
}
const X = wx => VCX + (wx - CAM.x) * CAM.z;
const Y = wy => VCY + (wy - CAM.y) * CAM.z;
const XC = i => Math.round(X(colX(i)));
const YR = j => Math.round(Y(j * RH));
function mrect(key) {
  const [c0, c1, r0, r1] = M[key];
  const x0 = XC(c0), x1 = XC(c1), y0 = YR(r0), y1 = YR(r1);
  return [x0, y0, x1 - x0, y1 - y0];
}
function cellBox(x, y, w, h, fill, border = INK, lw = 1.6) {
  if (w <= 2 || h <= 2) return;
  rect(x, y, w, h, fill);
  g.strokeStyle = border; g.lineWidth = lw;
  g.strokeRect(x + lw / 2, y + lw / 2, w - lw, h - lw);
}

// Helper to draw clean titled comparison cards inside merged spreadsheet ranges
function drawCard(key, { badgeBg = INDIGO, badgeFg = '#FFFFFF', badgeTxt = '', title = '', bullets = [], bg = '#FFFFFF', titleCol = INK, z = 1 }) {
  const [x, y, w, h] = mrect(key);
  if (w < 24 || h < 24) return;
  cellBox(x, y, w, h, bg, INK, 1.7);
  const stripH = Math.round(32 * z);
  rect(x + 1.6, y + 1.6, w - 3.2, stripH, badgeBg);
  text(badgeTxt, x + 14 * z, y + stripH / 2 + 1, `800 ${13.5 * z}px ${MONO}`, badgeFg);

  let curY = y + stripH + 22 * z;
  if (title) {
    const tFont = `800 ${17.5 * z}px ${UI}`;
    const tLines = wrapLines(title, tFont, w - 28 * z);
    tLines.forEach(ln => {
      text(ln, x + 14 * z, curY, tFont, titleCol);
      curY += 23 * z;
    });
    line(x + 12 * z, curY - 7 * z, x + w - 12 * z, curY - 7 * z, '#D6D5CE', 1);
    curY += 6 * z;
  }
  const bFont = `500 ${14.8 * z}px ${UI}`;
  bullets.forEach(b => {
    const bLines = wrapLines(b, bFont, w - 28 * z);
    bLines.forEach((ln, li) => {
      if (curY < y + h - 10 * z) {
        text(ln, x + (li === 0 ? 14 : 26) * z, curY, bFont, '#1F2937');
        curY += 21 * z;
      }
    });
    curY += 3 * z;
  });
}

// ───────────────────────── Draw Sheet Grid & All 8 Educational Chapters ─────────────────────────
function drawSheet(t) {
  const z = CAM.z;
  rect(ROWH_W, SHEET_Y, VW, VH, '#FFFFFF');

  g.save();
  g.beginPath(); g.rect(ROWH_W, SHEET_Y, VW, VH); g.clip();

  const c0 = 0, c1 = NC;
  const r0 = Math.max(0, Math.floor((CAM.y - (VCY - SHEET_Y) / z) / RH) - 1);
  const r1 = Math.min(162, Math.ceil((CAM.y + (SHEET_B - VCY) / z) / RH) + 1);
  const drawVals = 11 * z >= 6.5;

  // Finale 6-step banded colour-scale payoff radiating from (col 14, row 144) after t = 208.3s!
  const bloomOn = t >= 208.3;
  const bloomR = bloomOn ? (t - 208.3) * 18 : 0;

  for (let i = c0; i <= c1; i++) {
    const cw = colW(i); if (cw < 0.8) continue;
    const x = XC(i), w = XC(i + 1) - x;
    if (x + w < ROWH_W || x > W) continue;
    for (let j = r0; j <= r1; j++) {
      const y = YR(j), h = YR(j + 1) - y;
      if (bloomOn) {
        const d = Math.hypot((i - 14) * 0.85, (j - 144) * 0.55);
        if (d <= bloomR) {
          const band = Math.floor(d / 2.2) % PASTEL.length;
          const fl = clamp(1 - (bloomR - d) / 2.4, 0, 1);
          rect(x, y, w, h, fl > 0 ? hexMix(PASTEL[band], '#FFFFFF', fl * 0.65) : PASTEL[band]);
          if (drawVals && w > 30) text(`+${90 + (i + j) % 10}%`, x + w / 2, y + h / 2 + 1, `500 ${9.5 * z}px ${MONO}`, 'rgba(23,18,10,0.25)', 'center');
        }
      }
    }
  }

  // Crisp grid lines
  g.strokeStyle = '#DAD9D3'; g.lineWidth = 1; g.beginPath();
  for (let i = c0; i <= c1 + 1; i++) {
    if (i <= NC && colW(i) < 0.8) continue;
    const x = XC(i) + 0.5;
    if (x >= ROWH_W && x <= W) { g.moveTo(x, SHEET_Y); g.lineTo(x, SHEET_B); }
  }

          '✓ [P — PERSONA]  →  [C — CONTEXT]  →  [T — TASK]',
          '✓ [P — PATTERN]  →  [R — RULES] (ngắn gọn, kiểm chứng được)',
          '✓ Cuối cùng luôn chốt ô:  [INPUT]  {{NỘI_DUNG_BÁO_CÁO}}',
          '✓ Copy 1 chạm sang AI làm việc → Đầu ra có kiểm soát 100%!'
        ],
        bg: SOFT_OK, titleCol: OK_INK, z
      });
    }
  }

  // ── CHAPTER 8: 3-Step Daily Routine (197.4s+) & Grand Finale Stage (208.4s+) ──
  if (t >= 197.4) {
    const [hx, hy, hw, hh] = mrect('FIN_3HDR');
    cellBox(hx, hy, hw, hh, INDIGO, INK, 2);
    text('QUY TRÌNH 3 BƯỚC HÀNG NGÀY CHO KẾ TOÁN TRƯỞNG (CHỈ MẤT 30 GIÂY — KHÔNG CẦN NHỚ THUỘC LÒNG!)', hx + 20 * z, hy + hh / 2 + 1, `800 ${19 * z}px ${UI}`, '#FFFFFF');

    const steps = [
      ['FIN_S1', 'BƯỚC 1 · GÕ Ý ĐỊNH THÔ', 'Gõ tự nhiên 1 câu vào Bộ Tối Ưu PCTPR', ['VD: “Phân tích bảng chi phí Quý 3 tìm khoản bất thường”'], AMBER, INK],
      ['FIN_S2', 'BƯỚC 2 · COPY KHUNG PCTPR 9/10', 'Nhận ngay 1 Code Block đủ 5 mục chuẩn', ['Đã khóa sẵn Vai trò CFO, Bảng 4 cột & Luật cấm bịa số!'], REF_COLS[0], '#FFFFFF'],
      ['FIN_S3', 'BƯỚC 3 · DÁN SỐ LIỆU VÀO [INPUT]', 'Thay ô {{DỮ_LIỆU}} bằng bảng số thật', ['Nhận báo cáo chuẩn xác, kiểm soát 100% chất lượng đầu ra!'], OK, INK],
    ];
    for (const [k, bTxt, ttl, bul, bBg, bFg] of steps) {
      drawCard(k, { badgeBg: bBg, badgeFg: bFg, badgeTxt: bTxt, title: ttl, bullets: bul, bg: '#FFFFFF', z: z * 1.06 });
    }
  }

  if (t >= 208.4) {
    const [tx, ty, tw0, th0] = mrect('FIN_TOP');
    cellBox(tx, ty, tw0, th0, '#FFFFFF', INK, 2.4);
    rect(tx + 2.5, ty + 2.5, 16 * z, th0 - 5, INDIGO);
    text('THÔNG ĐIỆP DÀNH TẶNG KẾ TOÁN TRƯỞNG THẾ HỆ 1981', tx + 32 * z, ty + th0 * 0.32, `800 ${15 * z}px ${MONO}`, INDIGO);
    text('20 năm quản trị kế toán chặt chẽ chính là nền tảng vàng để anh chị làm chủ AI bài bản!', tx + 32 * z, ty + th0 * 0.70, `800 ${25 * z}px ${UI}`, INK);

    if (t >= 216.2) {
      const [bx, by, bw0, bh0] = mrect('FIN_BOT');
      cellBox(bx, by, bw0, bh0, INDIGO, INK, 2.4);
      rect(bx + 2.5, by + 2.5, 16 * z, bh0 - 5, OK);
      text('5 CHỮ VÀNG KHI LÀM VIỆC VỚI AI  ·  CÔNG CỤ TỐI ƯU HÓA PROMPT PCTPR (OKR ~9/10)', bx + 32 * z, by + bh0 * 0.32, `800 ${15 * z}px ${MONO}`, OK);
      text('[P] Rõ Vai Trò  ·  [C] Đủ Bối Cảnh  ·  [T] Sắc Nhiệm Vụ  ·  [P] Chuẩn Khuôn Mẫu  ·  [R] Chặt Quy Tắc', bx + 32 * z, by + bh0 * 0.70, `800 ${23.5 * z}px ${UI}`, '#FFFFFF');
    }
  }

  // Hero Selection Box (thick ink border + fill handle)
  const selKey = activeSelection(t);
  if (selKey && M[selKey]) {
    const [sx, sy, sw, sh] = mrect(selKey);
    if (sw > 12 && sh > 12) {
      g.strokeStyle = INK; g.lineWidth = 3.2;
      g.strokeRect(sx - 1, sy - 1, sw + 2, sh + 2);
      rect(sx + sw - 5, sy + sh - 5, 10, 10, '#FFFFFF');
      rect(sx + sw - 3.5, sy + sh - 3.5, 7, 7, INK);
    }
  }

  g.restore();
}

// ───────────────────────── Generic Spreadsheet Software Shell (Never Zooms!) ─────────────────────────
function drawHeadersAndChrome(t) {
  rect(0, SHEET_Y - HDR, ROWH_W, HDR, '#DDDCD5');
  rect(ROWH_W, SHEET_Y - HDR, VW, HDR, '#EAE9E3');
  rect(0, SHEET_Y, ROWH_W, VH, '#EAE9E3');

  const selKey = activeSelection(t);
  const [sc0, sc1, sr0, sr1] = selKey && M[selKey] ? M[selKey] : [-1, -1, -1, -1];

  g.save();
  g.beginPath(); g.rect(ROWH_W, SHEET_Y - HDR, VW, HDR); g.clip();
  for (let i = 0; i <= NC; i++) {
    const cw = colW(i); if (cw < 1) continue;
    const x = XC(i), w = XC(i + 1) - x;
    if (x + w < ROWH_W || x > W) continue;
    const active = i >= sc0 && i < sc1;
    if (active) { rect(x, SHEET_Y - HDR, w, HDR, '#D4D3CB'); rect(x, SHEET_Y - 3, w, 3, INK); }
    line(x + w + 0.5, SHEET_Y - HDR, x + w + 0.5, SHEET_Y, '#BFBEB6');
    if (w > 18) text(colName(i), x + w / 2, SHEET_Y - HDR / 2 + 1, `${active ? 800 : 600} 13px ${UI}`, active ? INK : '#4A4943', 'center');
  }
  g.restore();

  g.save();
  g.beginPath(); g.rect(0, SHEET_Y, ROWH_W, VH); g.clip();
  const j0 = Math.max(0, Math.floor((CAM.y - (VCY - SHEET_Y) / CAM.z) / RH));
  const j1 = Math.min(162, Math.ceil((CAM.y + (SHEET_B - VCY) / CAM.z) / RH));
  for (let j = j0; j <= j1; j++) {
    const y = YR(j), h = YR(j + 1) - y;
    const active = j >= sr0 && j < sr1;
    if (active) { rect(0, y, ROWH_W, h, '#D4D3CB'); rect(ROWH_W - 3, y, 3, h, INK); }
    line(0, y + h + 0.5, ROWH_W, y + h + 0.5, '#BFBEB6');
    if (h > 11) text(String(j + 1), ROWH_W / 2, y + h / 2 + 1, `${active ? 700 : 500} 12px ${MONO}`, active ? INK : '#57564F', 'center');
  }
  g.restore();
  line(ROWH_W - 0.5, SHEET_Y - HDR, ROWH_W - 0.5, SHEET_B, '#A8A79F');
  line(0, SHEET_Y - 0.5, W, SHEET_Y - 0.5, '#A8A79F');

  // Title Bar
  rect(0, 0, W, TITLE_H, '#DCDAD3');
  rect(16, 9, 16, 16, OK); g.strokeStyle = INK; g.lineWidth = 1.5; g.strokeRect(16, 9, 16, 16);
  text('so-tay-pctpr-ke-toan-truong-1981.sheet', 42, TITLE_H / 2 + 1, `700 13.5px ${MONO}`, INK);
  text('Hướng Dẫn Tư Duy Khung Tạo Prompt PCTPR & Công Cụ Tối Ưu Hóa Đầu Ra Có Kiểm Soát', W / 2, TITLE_H / 2 + 1, `600 13px ${UI}`, '#4A4943', 'center');
  text(t < 154.9 ? 'Chế độ: Giải mã 5 thành phần PCTPR' : 'Chế độ: PCTPR Prompt Optimizer (OKR ~9/10)', W - 18, TITLE_H / 2 + 1, `700 12.5px ${MONO}`, OK_INK, 'right');
  line(0, TITLE_H - 0.5, W, TITLE_H - 0.5, '#BDBCB4');

  // Toolbar
  const ty = TITLE_H, tm = ty + TOOL_H / 2;
  rect(0, ty, W, TOOL_H, '#F1F0EB');
  const tools = [
    ['Inter', 78, false], ['B', 30, true],
    ['1. P-Persona', 112, t >= 28.6 && t < 66.4],
    ['2. C-Context', 114, t >= 66.4 && t < 86.2],
    ['3. T-Task', 96, t >= 86.2 && t < 106.0],
    ['4. P-Pattern', 112, t >= 106.0 && t < 125.5],
    ['5. R-Rules', 102, t >= 125.5 && t < 154.9],
    [t < 154.9 ? 'Cột ẩn R:AA (Optimizer)' : '✓ Đã mở PCTPR Optimizer (R:AA)', 236, t >= 154.9],
    ['OKR: ~9/10 Điểm', 138, t >= 134.8],
  ];
  let tx = 14;
  for (const [lbl, bw, active] of tools) {
    rect(tx, ty + 7, bw, TOOL_H - 14, active ? AMBER : '#FFFFFF');
    g.strokeStyle = active ? INK : '#C6C5BD'; g.lineWidth = 1;
    g.strokeRect(tx + 0.5, ty + 7.5, bw - 1, TOOL_H - 15);
    text(lbl, tx + bw / 2, tm + 1, `${active ? 700 : 500} 12px ${UI}`, INK, 'center');
    tx += bw + 7;
  }
  line(0, ty + TOOL_H - 0.5, W, ty + TOOL_H - 0.5, '#C8C7BF');

  // Formula Bar
  const fy = TITLE_H + TOOL_H, fm = fy + FBAR_H / 2 + 1;
  rect(0, fy, W, FBAR_H, '#F8F7F3');
  const F = formulaState(t);
  rect(12, fy + 8, 146, FBAR_H - 16, '#FFFFFF');
  g.strokeStyle = '#B4B3AB'; g.strokeRect(12.5, fy + 8.5, 145, FBAR_H - 17);
  text(F.name, 22, fm, `700 14.5px ${MONO}`, INK);
  text('fx', 186, fm, `italic 700 18px ${UI}`, '#444', 'center');
  rect(212, fy + 6, W - 226, FBAR_H - 12, '#FFFFFF');
  g.strokeStyle = '#B4B3AB'; g.strokeRect(212.5, fy + 6.5, W - 227, FBAR_H - 13);
  let fx = 226;
  for (const [segStr, col] of F.parts) {
    const f = `700 20px ${MONO}`;
    text(segStr, fx, fm, f, col);
    fx += tw(segStr, f);
  }
  if (F.caret && Math.floor(t * 8) % 2 === 0) rect(fx + 3, fy + 12, 2.5, FBAR_H - 24, INK);
  line(0, fy + FBAR_H - 0.5, W, fy + FBAR_H - 0.5, '#B4B3AB');

  // Unhide Context Menu right before 154.9s!
  if (t >= 154.25 && t < 155.05) {
    const mx = Math.min(1320, Math.max(380, XC(17) + 8)), my = SHEET_Y + 12, mw = 320, mh = 132;
    rect(mx, my, mw, mh, '#FBFBF9'); g.strokeStyle = INK; g.lineWidth = 1.6; g.strokeRect(mx, my, mw, mh);
    ['Chèn cột mới', 'Ẩn cột', 'Mở cột ẩn: PCTPR Prompt Optimizer (R:AA)', 'Kiểm tra chuẩn OKR 9/10'].forEach((it, idx) => {
      const iy = my + 8 + idx * 29;
      if (idx === 2) rect(mx + 4, iy, mw - 8, 27, t >= 154.7 ? OK : AMBER);
      text(it, mx + 14, iy + 13.5, `${idx === 2 ? 700 : 500} 13px ${UI}`, INK);
    });
  }

  // Sheet Tabs along Bottom Bar (lights up chapter by chapter!)
  const by = SHEET_B;
  rect(0, by, W, TABS_H, '#E5E4DE');
  line(0, by + 0.5, W, by + 0.5, '#A2A19A');
  const activeTab = t < 28.6 ? 0 : t < 66.4 ? 1 : t < 86.2 ? 2 : t < 106.0 ? 3 : t < 125.5 ? 4 : t < 154.9 ? 5 : t < 197.4 ? 6 : 7;
  let tabX = 18;
  [
    '1_Mo_Dau_1981', '2_P_Vai_Tro', '3_C_Boi_Canh', '4_T_Nhiem_Vu',
    '5_P_Khuon_Mau', '6_R_Quy_Tac', '7_Bo_Toi_Uu_PCTPR', '8_Thuc_Hanh_3_Buoc'
  ].forEach((nm, idx) => {
    const on = idx === activeTab;
    const w = tw(nm, `700 12.5px ${UI}`) + 28;
    if (on) { rect(tabX, by, w, TABS_H - 3, '#FFFFFF'); rect(tabX, by + TABS_H - 3, w, 3, OK); }
    text(nm, tabX + w / 2, by + TABS_H / 2, `${on ? 700 : 500} 12.5px ${UI}`, on ? INK : '#57564F', 'center');
    line(tabX + w + 0.5, by + 5, tabX + w + 0.5, by + TABS_H - 5, '#BDBCB4');
    tabX += w;
  });

  // Status Bar
  const sy = by + TABS_H, sm = sy + STAT_H / 2 + 1;
  rect(0, sy, W, STAT_H, INK);
  const recalc = (t >= 154.9 && t < 156.5) || (t >= 208.3 && t < 210.2);
  rect(0, sy, 88, STAT_H, recalc ? AMBER : '#2B2418');
  text(recalc ? 'OPTIMIZE' : 'READY', 44, sm, `700 11.5px ${MONO}`, recalc ? INK : '#FFFFFF', 'center');
  const msg = t < 28.6 ? 'Tư duy cốt lõi: Đừng gõ câu lệnh cụt lủn — hãy điền phiếu giao việc 5 ô P - C - T - P - R'
    : t < 66.4 ? '[P — Persona]: Cùng bài toán chạy bộ hoặc chi phí quý, đổi chuyên gia là đổi hoàn toàn góc nhìn!'
    : t < 86.2 ? '[C — Context]: Nêu rõ bối cảnh doanh nghiệp & dùng biến giữ chỗ {{...}} khi chưa sẵn dữ liệu'
    : t < 106.0 ? '[T — Task]: Bắt đầu bằng động từ hành động rõ ràng (Đối chiếu · Xác định · Đề xuất)'
    : t < 125.5 ? '[P — Pattern]: Khóa khuôn mẫu bảng biểu cụ thể để dán thẳng vào báo cáo quản trị'
    : t < 154.9 ? '[R — Rules]: Chốt kiểm soát nội bộ — Cấm tự bịa số liệu · Less is More · OKR ~9/10'
    : t < 197.4 ? 'PCTPR Prompt Optimizer: Không bao giờ làm hộ việc thô — Chỉ xuất 1 Code Block chuẩn + [INPUT]'
    : 'Hoàn tất: 3 bước thực hành mỗi ngày giúp Kế toán trưởng thế hệ 1981 làm chủ AI!';
  text(msg, 104, sm, `500 12px ${UI}`, 'rgba(255,255,255,0.90)');
  text(`ZOOM ${Math.round(CAM.z * 100)}%`, W - 20, sm, `700 12px ${MONO}`, AMBER, 'right');
}

// ───────────────────────── Yellow Cell-Comment Subtitle Note (STYLE.md §4) ─────────────────────────
let VO = [];
function drawCommentSub(t) {
  const cue = VO.find(c => t >= c.c0 && t < c.c1);
  if (!cue) return;
  const a = Math.min(seg(t, cue.c0, cue.c0 + 0.14), 1 - seg(t, cue.c1 - 0.14, cue.c1));
  if (a <= 0) return;

  const f = `600 23.5px ${UI}`;
  const lines = wrapLines(cue.sub, f, 1560);
  const w = Math.max(...lines.map(l => tw(l, f))) + 52;
  const h = lines.length === 1 ? 56 : lines.length === 2 ? 86 : 114;
  const x = ROWH_W + 24, y = SHEET_B - h - 12;

  g.save();
  g.globalAlpha = eo(a);
  rect(x, y, w, h, NOTE);
  g.strokeStyle = INK; g.lineWidth = 1.7;
  g.strokeRect(x + 0.8, y + 0.8, w - 1.6, h - 1.6);
  // Red comment triangle in top-right corner
  g.fillStyle = NO;
  g.beginPath(); g.moveTo(x + w - 15, y + 1.5); g.lineTo(x + w - 1.5, y + 1.5); g.lineTo(x + w - 1.5, y + 15); g.fill();
  lines.forEach((ln, idx) => {
    const baseY = lines.length === 1 ? h / 2 + 1 : 27 + idx * 30;
    text(ln, x + 22, y + baseY, f, INK);
  });
  g.restore();
}

// ───────────────────────── Deterministic Foley Events (`window.EV`) ─────────────────────────
const EV = [];
[0.3, 9.5, 18.6, 28.9, 37.2, 47.4, 56.6, 66.8, 76.0, 86.6, 106.5, 125.9, 155.2, 197.6, 208.5].forEach(tk => {
  for (let q = 0; q < 8; q++) EV.push({ t: +(tk + q * 0.07).toFixed(3), type: 'key_click' });
  EV.push({ t: +(tk + 0.95).toFixed(3), type: 'enter_hit' });
});
[18.8, 19.6, 20.4, 21.2, 22.0, 76.2, 77.0, 77.8, 78.6, 79.4, 115.6, 134.9, 175.9, 186.6, 216.3].forEach(th => {
  EV.push({ t: th, type: 'cell_hop' });
});
for (let i = 0; i < 10; i++) EV.push({ t: +(154.92 + i * 0.07).toFixed(3), type: 'col_ratchet', idx: i });
for (let b = 0; b < 18; b++) EV.push({ t: +(208.35 + b * 0.08).toFixed(3), type: 'paint_sweep', p: b / 18 });
[22.2, 135.2, 186.9, 216.5].forEach(td => EV.push({ t: td, type: 'okr_ding' }));
// 3 Planned Dramatic Silences (gates music to 0 before major turns!)
EV.push(
  { t: 27.60, dur: 0.95, type: 'silence' },
  { t: 153.80, dur: 1.05, type: 'silence' },
  { t: 207.40, dur: 0.90, type: 'silence' }
);
EV.sort((a, b) => a.t - b.t);
window.DUR = DUR;
window.EV = EV;

function setupFrame(t) {
  updateLayout(t);
  CAM = evalCamera(t);
  HDR = Math.round(26 * clamp(Math.sqrt(CAM.z), 0.92, 1.30));
  SHEET_Y = TITLE_H + TOOL_H + FBAR_H + HDR;
  VW = W - ROWH_W; VH = SHEET_B - SHEET_Y;
  // Offset optical sheet center upward by 46px so bottom-left yellow subtitle note has clean room!
  VCX = ROWH_W + VW / 2; VCY = SHEET_Y + (VH - 78) / 2;
  CAM.x = Math.max(CAM.x, (VCX - ROWH_W) / CAM.z);
  CAM.y = Math.max(CAM.y, (VCY - SHEET_Y) / CAM.z);
}

const noSub = new URLSearchParams(location.search).get('nosub') === '1';
window.render = function (t) {
  t = clamp(t, 0, DUR);
  setupFrame(t);
  rect(0, 0, W, H, INK);
  drawSheet(t);
  drawHeadersAndChrome(t);
  if (!noSub) drawCommentSub(t);
};

const SAMPLE_VI = 'Chào anh chị Kế toán trưởng thế hệ 1981! Chuyên gia Dinh dưỡng Huấn luyện viên Thể lực {{NỘI_DUNG_BÁO_CÁO}} PCTPR 9/10';
Promise.all([
  document.fonts.load('500 24px Inter', SAMPLE_VI),
  document.fonts.load('700 24px Inter', SAMPLE_VI),
  document.fonts.load('800 32px Inter', SAMPLE_VI),
  document.fonts.load('700 20px JBMono', SAMPLE_VI),
  fetch('./vo/vo_timeline.json').then(r => r.ok ? r.json() : []).catch(() => []),
]).then(async ([,,,, vo]) => {
  await document.fonts.ready;
  VO = (vo || []).map((c, idx, arr) => {
    const nextT0 = idx + 1 < arr.length ? arr[idx + 1].t0 - 0.10 : DUR - 0.15;
    const c0 = Math.max(0.05, c.t0 - 0.06);
    const c1 = Math.min(nextT0, Math.max(c.t1 + 0.50, c0 + 1.85));
    return { ...c, c0, c1 };
  });
  window.render(0);
  window.READY = true;
});
</script>
